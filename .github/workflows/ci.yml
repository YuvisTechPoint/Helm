name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        env:
          USE_SQLITE: "true"
          SQLITE_URL: sqlite:////tmp/engine-test.db
          ENGINE_MODE: dev
        run: pytest -q

      - name: Run full E2E harness
        env:
          USE_SQLITE: "true"
          SQLITE_URL: sqlite:////tmp/engine-e2e.db
          ENGINE_MODE: dev
        run: python run_e2e.py
