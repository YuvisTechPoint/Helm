services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
      POSTGRES_DB: engine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: engine
      MINIO_ROOT_PASSWORD: engine-secret
    ports:
      - "9000:9000"
      - "9001:9001"

  temporal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  api:
    build: .
    command: python run_api.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://engine:engine@postgres:5432/engine
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: engine
      S3_SECRET_KEY: engine-secret
      S3_BUCKET: engine
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python run_worker.py
    depends_on:
      - api
      - temporal
    # Scale independently of the API: `docker compose up --scale worker=3`
    environment:
      DATABASE_URL: postgresql+psycopg://engine:engine@postgres:5432/engine
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: engine
      S3_SECRET_KEY: engine-secret
      S3_BUCKET: engine

  owner-web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./apps/owner-web:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
