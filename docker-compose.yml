# YouTube Channel Engine — production-grade local/staging stack
# Usage: docker compose up --build
# Scale workers: docker compose up --scale worker=3

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
      POSTGRES_DB: engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: engine
      MINIO_ROOT_PASSWORD: engine-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: engine
      POSTGRES_PWD: engine
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://engine:engine@postgres:5432/engine
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: youtube-engine
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: engine
      S3_ACCESS_KEY: engine
      S3_SECRET_KEY: engine-secret
      ENGINE_MODE: staging
      RUN_MIGRATIONS: "true"
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      API_KEY: ${API_KEY:-staging-dev-key}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    command: ["python", "run_worker.py"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://engine:engine@postgres:5432/engine
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: youtube-engine
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: engine
      S3_ACCESS_KEY: engine
      S3_SECRET_KEY: engine-secret
      ENGINE_MODE: staging
      RUN_MIGRATIONS: "false"
      LOG_FORMAT: json

  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./apps/dashboard:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
