[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-engine"
version = "0.1.0"
description = "Autonomous faceless YouTube channel and lead-to-client acquisition platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "cryptography>=43",
  "httpx>=0.27",
  "temporalio>=1.8",
  "redis>=5.2",
  "boto3>=1.35",
  "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
dual-engine-api = "scripts.api:main"
dual-engine-worker = "scripts.worker:main"
dual-engine-e2e = "scripts.e2e:main"
dual-engine-dev = "scripts.dev:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
