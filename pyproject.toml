[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-engine"
version = "0.1.0"
description = "Faceless YouTube engine and lead-to-client acquisition engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "cryptography>=43",
  "httpx>=0.27",
  "temporalio>=1.8",
  "redis>=5.2",
  "boto3>=1.35",
  "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["packages/core", "apps/youtube", "apps/acquisition", "apps/api"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["packages/core", "apps/youtube", "apps/acquisition", "apps/api"]
